[project]
name = "server"
version = "0.1.0"
description = "Offload-endpoint FastAPI server for adaptive-offload."
requires-python = ">=3.11"
# `database` (for `common.db`/`common.models`) is not listed here as a PEP 508
# dependency — plain pip has no portable relative-path syntax for it. Install
# it explicitly into this package's venv instead, once `server/api/` needs it:
#   pip install -e ../database
#   pip install -e ".[dev]"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["build/"]
# `common` (from `database/common`, installed via `pip install -e ../database`)
# resolves at runtime through that editable install's import hook, not through
# mypy's filesystem module search. Point mypy at `common`'s import root, as
# `training/pyproject.toml` does.
mypy_path = "../database"
