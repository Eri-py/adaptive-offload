[project]
name = "training"
version = "0.1.0"
description = "Data-gen simulator and router training code for adaptive-offload."
requires-python = ">=3.11"
# `server` (for `common.db`/`common.models`) is not listed here as a PEP 508
# dependency — plain pip has no portable relative-path syntax for it. Install
# it explicitly into this package's venv instead:
#   pip install -e ../server
#   pip install -e ".[dev]"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datagen*", "router*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["build/"]
# `common` (from `server/common`, installed via `pip install -e ../server`) is
# only resolvable at runtime through that install's editable-install import
# hook, not through mypy's static filesystem-based module search. Point mypy
# directly at `server/` (which is `common`'s own import root, per Task 1) so
# `from common... import ...` type-checks instead of failing as unresolved.
mypy_path = "../server"

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
